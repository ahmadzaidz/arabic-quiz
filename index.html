<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame">
  <div class="ornament-top"></div>
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="quiz">Quiz</button>
      <button class="tab-btn" data-tab="add">Add Questions</button>
    </div>
    <div id="quizTab" class="tab-panel active">
      <div id="app">Loading...</div>
    </div>
  <div id="addTab" class="tab-panel">
    <p class=""add-instructions>
      Build questions in a spreadsheet with columns:<br>
      question | answer | wrong1 | wrong2 | wrong3 | explanation <br> 
      Copy the cells and paste below.
    </p>
    <textarea id="pasteArea" rows="10" placeholder="Paste spreadsheet rows here..."></textarea>
  <button id="loadBtn" class="next-btn show">Load Questions</button>
  <div id="loadStatus"></div>
  </div>
  </div>
  <div class="ornament-bottom"></div>
</div>

<script src="questions.js" charset="utf-8"></script>

<script src="script.js"></script>

</body>
</html>
